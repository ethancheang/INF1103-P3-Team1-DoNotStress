{% extends "base.html" %}
{% block content %}
<div id="dns-campus" aria-label="DoNotStress student wellbeing app">
  <header class="ds-top">
    <div class="ds-brand"><span class="ds-logo" aria-hidden="true">✿</span>DoNotStress<span class="ds-campus-label">/ campus</span></div>
    <nav class="ds-nav" aria-label="Main">
      <button data-nav="home" aria-current="page">Overview</button>
      <button data-nav="checkin">Check-in</button>
      <button data-nav="garden">My garden</button>
    </nav>
  </header>
  <div class="ds-demo">Frontend demo · answers are validated, not saved · results are illustrative</div>
  <main id="ds-main"></main>
  <noscript><p>This interactive check-in needs JavaScript. Enable it and reload this page.</p></noscript>
</div>
<script id="campus-config" type="application/json">{{ boot | tojson }}</script>
<script src="{{ url_for('static', filename='campus.js') }}" defer></script>
{% endblock %}
