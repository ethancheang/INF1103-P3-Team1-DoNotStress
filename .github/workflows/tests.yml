name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the automated unit tests (offline, no live AI key)
        env:
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s tests -p "test_*.py" -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t donotstress .

      - name: Run automated tests inside Docker container
        run: docker run --rm -e GEMINI_API_KEY="" donotstress python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify container starts and /health responds 200
        run: |
          docker run -d --name donotstress-smoke -p 5000:5000 -e GEMINI_API_KEY="" donotstress
          trap 'docker rm -f donotstress-smoke >/dev/null 2>&1 || true' EXIT
          python -c "import time, urllib.request, json;
          for _ in range(20):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2) as r:
                      data = json.load(r)
                      assert r.status == 200 and data.get('status') == 'ok', data
                      break
              except Exception:
                  time.sleep(0.5)
          else:
              raise SystemExit('Container /health check failed')"
